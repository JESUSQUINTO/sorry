<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sorry baby kc</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Hi, <span id="nm" contenteditable="true" spellcheck="false">BABYKC</span> 💖</h1>
  <p>Touch anything. Seriously, KAHIT ANO</p>
</header>
 
<main>
  <div class="tile wide" id="sorry"><h2>I have something to say</h2><div class="msg" id="sm">Tap here 🥺</div></div>
  <div class="tile" id="hearts"><h2>Squeeze it</h2><span class="big" id="h">❤️</span><div class="count" id="hc">0 hugs</div></div>

  <div class="tile" id="face"><h2>Pick a mood</h2><span class="big" id="fe">😘</span></div>
  <div class="tile" id="blob"><h2>Squish the blob</h2><div class="shape" id="sh"></div></div>
  <div class="tile wide" id="bal"><h2>Pop them all</h2><div class="balloons" id="bs"></div></div>
  <div class="tile wide" id="piano"><h2>Play me a song</h2><div class="keys" id="ks"></div></div>
</main>
<footer>Made with love, just for you. Go on, tap the empty space too 🌈</footer>
 
<script src="script.js"></script>
</body>
</html>
